#    restart: always
#    depends_on:
#      - fba_server
#    command:
#      - nginx
#      - -g
#      - daemon off;
#    volumes:
#      # nginx https conf
#      # When deploying with Docker, enable these mounts and ensure the certificate paths inside the container
#      # match the SSL certificate paths in the Nginx configuration. If you copy the certificates directly
#      # into the container, the mounts are unnecessary; comment them out or remove them.
#      # local_ssl_pem_path: Set the path to the SSL PEM certificate on the host
#      # local_ssl_key_path: Set the path to the SSL private key on the host
#      # /etc/ssl/xxx.pem: Set the certificate mount path inside the container
#      # /etc/ssl/xxx.key: Set the private key mount path inside the container
#      - local_ssl_pem_path:/etc/ssl/xxx.pem
#      - local_ssl_key_path:/etc/ssl/xxx.key
#      - fba_static:/www/fba_server/backend/static
#      - fba_static_upload:/www/fba_server/backend/static/upload
#    networks:
#      - fba_network

  fba_rabbitmq:
    hostname: fba_rabbitmq
    image: rabbitmq:3.13.7
    ports:
      - "${DOCKER_MAP_RABBITMA_UI_PORT:-15672}:15672"
      - "${DOCKER_MAP_RABBITMA_PORT:-5672}:5672"
    container_name: fba_rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - fba_rabbitmq:/var/lib/rabbitmq
    networks:
      - fba_network

  fba_celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVER_TYPE=fba_celery_worker
    image: fba_celery_worker:latest
    # Remove this container_name setting when deploying distributed workers
    container_name: fba_celery_worker
    restart: always
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - fba_rabbitmq
    volumes:
      - ./deploy/backend/docker-compose/.env.server:/fba/backend/.env
      - ${DOCKER_FBA_SERVER_LOG:-./logs/fba}:/var/log/fba
    networks:
      - fba_network
    command:
      - bash
      - -c
      - |
        wait-for-it -s fba_rabbitmq:5672 -t 300
        supervisord -c /etc/supervisor/supervisord.conf
        supervisorctl restart

  fba_celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVER_TYPE=fba_celery_beat
    image: fba_celery_beat:latest
    container_name: fba_celery_beat
    restart: always
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - fba_rabbitmq
      - fba_celery_worker
    volumes:
      - ./deploy/backend/docker-compose/.env.server:/fba/backend/.env
      - ${DOCKER_FBA_SERVER_LOG:-./logs/fba}:/var/log/fba
    networks:
      - fba_network
    command:
      - bash
      - -c
      - |
        wait-for-it -s fba_rabbitmq:5672 -t 300
        supervisord -c /etc/supervisor/supervisord.conf
        supervisorctl restart

  fba_celery_flower:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVER_TYPE=fba_celery_flower
    image: fba_celery_flower:latest
    ports:
      - "${DOCKER_MAP_CELERY_FLOWER_PORT:-8555}:8555"
    container_name: fba_celery_flower
    restart: always
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - fba_rabbitmq
      - fba_celery_worker
    volumes:
      - ./deploy/backend/docker-compose/.env.server:/fba/backend/.env
      - ${DOCKER_FBA_SERVER_LOG:-./logs/fba}:/var/log/fba
    networks:
      - fba_network
    command:
      - bash
      - -c
      - |
        wait-for-it -s fba_rabbitmq:5672 -t 300
        supervisord -c /etc/supervisor/supervisord.conf
        supervisorctl restart

  fba_celery_exporter:
    image: danihodovic/celery-exporter:latest
    restart: always
    ports:
      - "${DOCKER_MAP_CELERY_EXPORTER_PORT:-9808}:9808"
    container_name: fba_celery_exporter
    environment:
      - CE_BROKER_URL=amqp://guest:guest@fba_rabbitmq:5672//
    depends_on:
      - fba_rabbitmq
    networks:
      - fba_network

  fba_loki:
    image: grafana/loki:latest
    restart: always
    ports:
      - "${DOCKER_MAP_LOKI_PORT:-3100}:3100"
    container_name: fba_loki
    volumes:
      - fba_loki_data:/tmp/loki
    networks:
      - fba_network
    command: -config.file=/etc/loki/local-config.yaml

  fba_prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - "${DOCKER_MAP_PROMETHEUS_PORT:-9090}:9090"
    container_name: fba_prometheus
    depends_on:
      - fba_loki
    volumes:
      - ./deploy/backend/grafana/fba_prometheus.yml:/workspace/fba_prometheus.yml
      - fba_prometheus_data:/prometheus
    networks:
      - fba_network
    command:
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --config.file=/workspace/fba_prometheus.yml

  fba_alloy:
    image: grafana/alloy:latest
    restart: always
    ports:
      - "${DOCKER_MAP_ALLOY_GRPC_PORT:-4317}:4317"
      - "${DOCKER_MAP_ALLOY_HTTP_PORT:-4318}:4318"
      - "${DOCKER_MAP_ALLOY_UI_PORT:-12345}:12345"
    container_name: fba_alloy
    depends_on:
      - fba_loki
      - fba_prometheus
      - fba_tempo
      - fba_server
      - fba_celery_exporter
    volumes:
      - ./deploy/backend/grafana/fba_config.alloy:/etc/alloy/fba_config.alloy
    networks:
      - fba_network
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/fba_config.alloy

  fba_tempo:
    image: grafana/tempo:latest
    restart: always
    ports:
      - "${DOCKER_MAP_TEMPO_PORT:-3200}:3200"
    expose:
      - 4317
      - 4318
    container_name: fba_tempo
    depends_on:
      - fba_loki
      - fba_prometheus
    volumes:
      - ./deploy/backend/grafana/fba_tempo.yml:/etc/tempo/fba_tempo.yml
      - fba_tempo_data:/tmp
    networks:
      - fba_network
    command:
      - --config.file=/etc/tempo/fba_tempo.yml

  fba_grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "${DOCKER_MAP_GRAFANA_PORT:-3000}:3000"
    container_name: fba_grafana
    depends_on:
      - fba_loki
      - fba_prometheus
      - fba_tempo
    volumes:
      - ./deploy/backend/grafana/fba_grafana.ini:/etc/grafana/grafana.ini
      - ./deploy/backend/grafana/dashboards/fba_celery.json:/etc/grafana/dashboards/fba_celery.json
      - ./deploy/backend/grafana/dashboards/fba_server.json:/etc/grafana/dashboards/fba_server.json
      - ./deploy/backend/grafana/fba_dashboards.yml:/etc/grafana/provisioning/dashboards/fba_dashboards.yml
      - ./deploy/backend/grafana/fba_datasource.yml:/etc/grafana/provisioning/datasources/fba_datasource.yml
    networks:
      - fba_network
