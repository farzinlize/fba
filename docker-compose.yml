networks:
  fba_network:
    name: fba_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.10.10.0/24

volumes:
  # For MySQL, replace fba_postgres with fba_mysql
  fba_postgres:
    name: fba_postgres
  fba_redis:
    name: fba_redis
  fba_static:
    name: fba_static
  fba_static_upload:
    name: fba_static_upload
  fba_rabbitmq:
    name: fba_rabbitmq
  fba_loki_data:
    name: fba_loki_data
  fba_prometheus_data:
    name: fba_prometheus_data
  fba_tempo_data:
    name: fba_tempo_data

services:
  fba_server:
    build:
      context: .
      dockerfile: Dockerfile
    image: fba_server:latest
    ports:
      - "${DOCKER_MAP_SERVER_PORT:-8001}:8001"
    container_name: fba_server
    restart: always
    environment:
      - TZ=Asia/Shanghai
    # For MySQL, replace fba_postgres with fba_mysql
    depends_on:
      - fba_postgres
      - fba_redis
    volumes:
      - ./deploy/backend/docker-compose/.env.server:/fba/backend/.env
      - fba_static:/fba/backend/app/static
      - fba_static_upload:/fba/backend/static/upload
      - ${DOCKER_FBA_SERVER_LOG:-./logs/fba}:/var/log/fba
    networks:
      - fba_network
    # For MySQL, replace fba_postgres:5432 with fba_mysql:3306
    command:
      - bash
      - -c
      - |
        wait-for-it -s fba_postgres:5432 -s fba_redis:6379 -t 300
        supervisord -c /etc/supervisor/supervisord.conf
        supervisorctl restart

  fba_postgres:
    image: postgres:16
    ports:
      - "${DOCKER_MAP_POSTGRES_PORT:-5432}:5432"
    container_name: fba_postgres
    restart: always
    environment:
      POSTGRES_DB: fba
      POSTGRES_PASSWORD: 123456
      TZ: Asia/Shanghai
    volumes:
      - fba_postgres:/var/lib/postgresql/data
    networks:
      - fba_network

#  # For MySQL, keep the fba_mysql service definition and remove fba_postgres
#  fba_mysql:
#    image: mysql:8.0.41
#    ports:
#      - "${DOCKER_MAP_MYSQL_PORT:-3306}:3306"
#    container_name: fba_mysql
#    restart: always
#    environment:
#      MYSQL_DATABASE: fba
#      MYSQL_ROOT_PASSWORD: 123456
#      TZ: Asia/Shanghai
#    volumes:
#      - fba_mysql:/var/lib/mysql
#    networks:
#      - fba_network
#    command:
#      --default-authentication-plugin=mysql_native_password
#      --character-set-server=utf8mb4
#      --collation-server=utf8mb4_general_ci
#      --lower_case_table_names=1

  fba_redis:
    image: redis:latest
    ports:
      - "${DOCKER_MAP_REDIS_PORT:-6379}:6379"
    container_name: fba_redis
    restart: always
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - fba_redis:/data
    networks:
      - fba_network

  # Backend only
  # Use this container to deploy only the backend API service without a frontend
  # This conflicts with fba_ui below; comment out or remove fba_nginx if using fba_ui
  fba_nginx:
    image: nginx:latest
    ports:
      - "${DOCKER_MAP_NGINX_PORT:-8000}:80"
    container_name: fba_nginx
    restart: always
    depends_on:
      - fba_server
    volumes:
      - ./deploy/backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - fba_static:/www/fba_server/backend/static
      - fba_static_upload:/www/fba_server/backend/static/upload
    networks:
      - fba_network

#  # If the server has less than 4 GB of memory and fewer than four CPU cores,
#  # build this container separately from the frontend project or build it locally
