# ============================================================================
# Grafana data source provisioning configuration
# Official documentation: https://grafana.com/docs/grafana/latest/administration/provisioning/#datasources
# Automatically configure data sources as infrastructure as code
# ============================================================================

# API version
# Currently only version 1 is supported
apiVersion: 1

# Data source list
datasources:
  # ==========================================================================
  # Loki data source configuration
  # Loki is the Grafana log aggregation system, similar to Prometheus but for logs
  # Official documentation: https://grafana.com/docs/loki/latest/
  # ==========================================================================
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://fba_loki:3100
    isDefault: false
    editable: false
    version: 1
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '(?:"(?:traceid|trace_id|TraceID)"\s*:\s*"|\|\s*)([a-f0-9]{32})(?:"|\s*\|)'
          matcherType: regex
          name: TraceID
          url: $${__value.raw}
          urlDisplayLabel: View trace

  # ==========================================================================
  # Prometheus data source configuration
  # Prometheus is a cloud-native monitoring system for collecting and storing time-series metrics
  # Official documentation: https://prometheus.io/docs/
  # ==========================================================================
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://fba_prometheus:9090
    isDefault: true
    editable: false
    version: 1
    jsonData:
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: TraceID
          datasourceUid: tempo

  # ==========================================================================
  # Tempo data source configuration
  # Tempo is the Grafana distributed tracing backend
  # Official documentation: https://grafana.com/docs/tempo/latest/
  # ==========================================================================
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://fba_tempo:3200
    editable: false
    version: 1
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        spanStartTimeShift: "-1m"
        spanEndTimeShift: "1m"
        customQuery: true
        query: '{service_name="fba_server"} |= "${__span.traceId}"'
      search:
        hide: false
      serviceMap:
        datasourceUid: prometheus
      lokiSearch:
        datasourceUid: loki
