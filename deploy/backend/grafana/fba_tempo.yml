# ============================================================================
# Tempo configuration
# Tempo is the Grafana high-performance, low-cost distributed tracing backend
# Official documentation: https://grafana.com/docs/tempo/next/configuration/
# ============================================================================

# HTTP server configuration
server:
  http_listen_port: 3200

# Distributor configuration
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

# Metrics generator configuration
metrics_generator:
  registry:
    external_labels:
      source: tempo

  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://fba_prometheus:9090/api/v1/write
        send_exemplars: true

  processor:
    service_graphs:
      dimensions:
        - service.name
    span_metrics:
      dimensions:
        - service.name
        - http.method
        - http.target
        - http.status_code

# Storage configuration
storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

# Override configuration
overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
