# ============================================================================
# Grafana main configuration
# Official documentation: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
# ============================================================================

# [server] Server configuration
# Basic settings for the Grafana HTTP server
[server]
# Protocol type
protocol = http

# HTTP listening port
http_port = 3000

# [security] Security configuration
# Default security settings for Grafana
[security]
# Default Grafana administrator username
admin_user = admin

# Default Grafana administrator password
admin_password = 123456

# Enable when hosting Grafana over HTTPS
;cookie_secure = true

# Allow the browser to render Grafana in <frame>, <iframe>, <embed>, or <object> elements
;allow_embedding = true

# [users] User configuration
# Default user settings
[users]
# Login name/username placeholder on the login page
;login_hint = test

# Password placeholder on the login page
;password_hint = 123456

# Default UI theme
default_theme = system

# Default interface language
default_language = zh-Hans

# [dashboards] Dashboard configuration
# Default dashboard settings
[dashboards]
# Default home dashboard path
default_home_dashboard_path = /etc/grafana/dashboards/fba_server.json
